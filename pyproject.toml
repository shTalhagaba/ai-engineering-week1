[project]
name = "ai-engineering-week1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TalhaSadiq1", email = "talha.sadiq@31g.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "google-genai>=2.30.0",
    "numpy>=2.4.6",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-engineering-week1 = "ai_engineering_week1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
